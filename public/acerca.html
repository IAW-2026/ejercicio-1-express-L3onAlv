<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acerca de</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>¿De que se trata esto?</h1>
    <p>Se trata de una pagina que busca hacer enfasis en lo importantes que son los titulos.</p>
    <div class = "enlaces">
        <a href="/">Volver a casa</a>
        <a href="/contacto">Contactame</a>
    </div>
    <h2>Estas perdido? Necesitas una frase motivacional?</h2>
    <button id="botonFrase">Click aqui para subirte el animo</button>
    <p id="frase"></p>
    <script>
        document.getElementById('botonFrase').addEventListener('click', () => {
    fetch('/frase')
    .then(res => res.json())
    .then(data => {
      document.getElementById('frase').innerText = data.frase;
      console.log(data.frase);
    });
    });
    </script>
    <script src="script.js" ></script>
</body>
</html>
