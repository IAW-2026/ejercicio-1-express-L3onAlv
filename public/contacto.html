<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contactame</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Contacto</h1>
    <h2>Ingresa tu nombre y por que amas los titulos</h2>
    <form action="/contacto" method="POST">
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre" required>
        <br>
        <label for="mensaje">Mensaje:</label>
        <textarea id="mensaje" name="mensaje" required></textarea>
        <br>
        <button type="submit">Enviar</button>
    </form>
    <h2>Entonces, para ti, los titulos son importantes?</h2>
    <input type="radio" name="respuesta" value="si" id="si">
    <label for="si">Sí</label>
    <input type="radio" name="respuesta" value="no" id="no">
    <label for="no">No</label>
    <button id="boton">Enviar</button>
    <p id="respuesta"></p>
    <div class = "enlaces">
        <a href="/acerca">Acerca de</a>
        <a href="/">Volver a casa</a>
    </div>
    <script src="script.js" ></script>
</body>
</html>
